# Two services on one network: the 1.4 practice app, and the Postgres it talks to.
#
# Run:   docker compose up --build
# Stop:  docker compose down            (add -v to also delete the data volume)
#
# There is no `version:` key. It was required years ago, is ignored by modern
# Compose, and now only produces a warning — tutorials that still show it are old.

# Pinned rather than inferred. Without this, Compose names the project after
# whatever the directory happens to be called — so a clone into a differently
# named folder silently gets different network, volume and container names, and
# stops finding the volume it made yesterday.
name: sqlalchemy-upgrade-agent

services:
  db:
    # Pinned, not `postgres:latest`. `latest` means "whatever was newest when you
    # happened to pull", so two machines can silently run different majors — and
    # Postgres majors are not on-disk compatible.
    #
    # Alpine is fine HERE, unlike for the Python image. The musl problem was about
    # prebuilt Python wheels being built against glibc; Postgres is a C program the
    # image maintainers compile against musl themselves.
    image: postgres:16-alpine

    environment:
      # ${...} is substituted by Compose from the .env file sitting next to this
      # one. It does NOT automatically reach the container — it is filled in here,
      # and it reaches the container because this `environment:` block passes it.
      #
      # All three are read ONLY on first initialisation of the volume. Change one
      # later and nothing happens until `docker compose down -v`.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Without this, app tables land in the server's own `postgres` maintenance
      # database. Giving the app its own database costs one line.
      POSTGRES_DB: ${POSTGRES_DB}

    # Postgres writes its data here. Without this line that directory lives in the
    # container's writable layer and `docker compose down` destroys the database.
    volumes:
      - pgdata:/var/lib/postgresql/data

    # `depends_on` alone only waits for the container to START. Postgres takes a
    # few seconds more to accept connections, and an app that connects in that gap
    # gets "connection refused". This healthcheck is what turns "started" into
    # "actually ready" — see the `condition:` under app.
    healthcheck:
      # -U must be the role that actually exists. Leaving this as the default
      # `postgres` after setting POSTGRES_USER makes the check fail forever, the
      # service never turns healthy, and `app` waits on a condition that can
      # never be met — a hang with no error anywhere.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

    # Deliberately NO `ports:`. Published ports punch a hole from the host into a
    # container; they are for traffic arriving from outside. `app` reaches this
    # container over the Compose network without any port being published.
    #
    # To poke at the database yourself, you do not need a port either:
    #   docker compose exec db psql -U postgres

  qdrant:
    # Pinned for the same reason as postgres above. `latest` currently resolves to
    # the identical digest, so this changes nothing today and prevents the day it
    # would — which is the whole point of pinning (09-DECISIONS.md D16).
    image: qdrant/qdrant:v1.19.0

    volumes:
      - qdrantdata:/qdrant/storage

    # THIS is where the no-published-ports rule stops applying, and the reason
    # matters more than the exception.
    #
    # `db` publishes nothing because its only client, `app`, is another container
    # on this network. Publishing a port is for traffic arriving from OUTSIDE, and
    # `app` is not outside.
    #
    # Qdrant's client is `rag/index.py`, which runs on the HOST — it is a script
    # you invoke, not a service in this file. So the host genuinely IS outside, and
    # a published port is the correct tool rather than a shortcut.
    #
    # Bound to 127.0.0.1 explicitly. The short form `6333:6333` binds 0.0.0.0,
    # which exposes an unauthenticated vector database to every machine on the
    # network you are sitting on — a coffee-shop wifi problem, not a theoretical
    # one. This form is reachable from this machine and nowhere else.
    ports:
      - "127.0.0.1:6333:6333"

    # The Qdrant image ships bash but no curl, wget or nc, so the usual
    # `curl -f http://localhost:6333/readyz` is not available. bash's /dev/tcp
    # opens the socket and speaks just enough HTTP to read the status line, which
    # tests readiness rather than merely "is the port accepting connections".
    #
    # NOTE THE `CMD` + EXPLICIT `bash -c`, and do not "simplify" it to CMD-SHELL.
    # CMD-SHELL runs the string through `/bin/sh`, which on this image is dash,
    # and **`/dev/tcp` is a bash builtin rather than a real device** — dash reports
    # `cannot create /dev/tcp/...: Directory nonexistent` and the probe fails on
    # every attempt.
    #
    # Written first as CMD-SHELL, and the container sat `unhealthy` while serving
    # traffic perfectly well. That is the worst failure shape available: anything
    # later using `condition: service_healthy` would wait forever on a service
    # that was ready the whole time.
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    # `build:` instead of a registry pull — this one is built from the Dockerfile
    # in this directory.
    build: .

    # `image:` alongside `build:` means "build it, then TAG IT THIS". Without it
    # Compose invents a name from project+service (sqlalchemy-upgrade-agent-app),
    # which is a different image from anything you built by hand with
    # `docker build -t sqlalchemy-upgrade-agent .` — two images, one Dockerfile, drifting apart
    # silently. That is exactly how a 13-hour-stale image ended up producing
    # believable output and disproving nothing (COMPOSE-STUDY.md §4.0).
    #
    # With this line, `docker compose up --build` and `docker build -t sqlalchemy-upgrade-agent .`
    # produce the same image, and there is only ever one thing called sqlalchemy-upgrade-agent.
    image: sqlalchemy-upgrade-agent:latest

    environment:
      # Host in this URL is `db` — the service name above. Compose runs an embedded
      # DNS server on the network it creates, and every service name resolves to
      # that service's container. Not localhost, not an IP.
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      db:
        # Wait for the healthcheck to pass, not merely for the container to exist.
        condition: service_healthy

# Named volumes. Docker manages the storage, and they survive `docker compose down`.
# Only `docker compose down -v` removes them.
#
# qdrantdata holds the vector index. Losing it costs one `rag.index` run — about a
# second, since the vectors themselves live in corpus/embeddings.npy, which is the
# artifact worth protecting. That split is deliberate: D36 keeps embedding output
# in a file precisely so the database is cheap to rebuild and never the only copy.
volumes:
  pgdata:
  qdrantdata:
