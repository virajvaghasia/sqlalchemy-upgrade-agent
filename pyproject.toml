[project]
name = "sqlalchemy-upgrade-agent"
version = "0.1.0"
description = "RAG system that helps developers upgrade Python code from SQLAlchemy 1.4 to 2.0"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Viraj Vaghasia" }]
keywords = ["rag", "retrieval", "llm-evaluation", "sqlalchemy", "mcp", "agents"]
dependencies = [
    "psycopg2-binary>=2.9.12",
    "sqlalchemy==1.4.52",
]

# The embedding stack is an EXTRA, not a core dependency, and that is load-bearing.
# `requirements.txt` is generated with `uv export --no-hashes --no-emit-project` and
# the Dockerfile installs it, so anything listed above ships inside the app image.
# torch alone is roughly 2GB and the app container never embeds anything — it runs
# the 1.4 app. Same rule as issues.db: the image holds what it actually runs.
#
#     uv sync --extra embed       # on a machine that will embed
#     uv sync                     # everywhere else, unchanged
[project.optional-dependencies]
embed = [
    # BGE-M3 through sentence-transformers rather than FlagEmbedding. FlagEmbedding
    # exposes BGE-M3's dense, sparse and ColBERT outputs; sentence-transformers gives
    # dense only. Dense-only is exactly the Phase 1 constraint (build the naive version
    # first), so the simpler library is also the one that
    # cannot accidentally smuggle in hybrid retrieval two phases early.
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
]
# The web page. Pinned to the versions the deployed page runs
# (space/requirements.txt), so a local server and the hosted one are the same code.
serve = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]
# The MCP server (rag/mcp_server.py). The 2.x SDK: its server class is MCPServer,
# not the 1.x FastMCP, so the major version is pinned.
mcp = [
    "mcp>=2.3,<3",
]

[project.urls]
Repository = "https://github.com/virajvaghasia/sqlalchemy-upgrade-agent"
Demo = "https://virajvaghasia--sqlalchemy-upgrade-agent.modal.run"

# One command with three subcommands (rag/cli.py):
#     sqla-upgrade ask "why can't I call engine.execute any more?"
#     sqla-upgrade serve        # the web page, needs the `serve` extra
#     sqla-upgrade mcp          # the MCP server on stdio, needs the `mcp` extra
[project.scripts]
sqla-upgrade = "rag.cli:main"

# A build backend is what makes [project.scripts] installable. `uv sync` installs
# the project in editable mode, so the command runs the checkout it sits in.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "experiments", "tools"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # The server and the MCP server are tested in-process, so their libraries are
    # dev dependencies as well as extras. httpx is what FastAPI's TestClient drives.
    "fastapi==0.141.1",
    "httpx>=0.28",
    "mcp>=2.3,<3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
# The package lives at experiments/sqlalchemy_1_4_vs_2_0 and is imported by its
# full dotted path, exactly as the docs' `python -m ...` commands do. pytest does
# not add the rootdir to sys.path on its own, so say so rather than scattering
# __init__.py files or relying on the working directory.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# qdrant-client emits this from its own stderr handle during the import-time
# "is the stack up?" probes in test_index.py and test_score.py, so neither
# warnings.catch_warnings() nor contextlib.redirect_stderr() suppresses it.
# It only fires when Qdrant is partially reachable, which makes it INTERMITTENT
# -- and tools/check_runnable.py compares stdout AND stderr, so it silently
# breaks the doc blocks that run `pytest --collect-only` while their visible
# output stays identical. Filtered here because this is the only layer that
# catches it. Narrow on purpose: the message, not the category.
filterwarnings = ["ignore:Failed to obtain server version:UserWarning"]
